<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(145deg, #b8e1fc 0%, #90caf9 100%);
            padding: 20px;
            transition: background 0.4s ease;
        }

        body.dark-theme {
            background: linear-gradient(145deg, #0b2a3e 0%, #103549 100%);
        }

        .calculator-container {
            width: 100%;
            max-width: 400px;          
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            box-shadow: 0 25px 40px rgba(0, 80, 120, 0.35);
            padding: 28px 22px;
            position: relative;
            overflow: hidden;
            transition: background 0.3s, box-shadow 0.3s;
            border: 1px solid rgba(70, 150, 220, 0.4);
        }

        body.dark-theme .calculator-container {
            background: rgba(12, 35, 50, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid #1f556e;
            box-shadow: 0 20px 30px rgba(0, 15, 25, 0.7);
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: linear-gradient(145deg, #3f8ec9, #1f5e9e);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.25s;
            z-index: 10;
            box-shadow: 0 6px 14px rgba(0, 60, 130, 0.4);
            border: 1px solid #8fcbff;
        }

        .theme-toggle:hover {
            transform: scale(1.08) rotate(12deg);
            background: linear-gradient(145deg, #569be0, #2b6eb0);
        }

        body.dark-theme .theme-toggle {
            background: linear-gradient(145deg, #22668d, #0b3f5c);
            border-color: #4797c9;
            box-shadow: 0 6px 14px #02141e;
        }

        .theme-toggle i {
            font-size: 1.4rem;
        }

        .display {
            background: rgba(245, 250, 255, 0.95);
            border-radius: 32px;
            padding: 22px 25px;
            margin: 8px 0 35px 0;       
            text-align: right;
            border: 2px solid #b1d9fc;
            min-height: 160px;      
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: inset 0 6px 14px rgba(0, 70, 120, 0.08), 0 8px 18px rgba(30, 110, 180, 0.15);
            transition: all 0.3s;
            word-break: break-all;  
            overflow: hidden;         
        }

        body.dark-theme .display {
            background: #102433;
            border: 2px solid #1f6485;
            box-shadow: inset 0 6px 12px #010a13, 0 8px 16px #02121e;
        }

        .previous-operand {
            font-size: 1.3rem;          
            color: #1e5775;
            min-height: 30px;
            white-space: nowrap;
            font-weight: 400;
            letter-spacing: 0.5px;
            overflow: hidden;
            text-overflow: ellipsis;     
        }

        body.dark-theme .previous-operand {
            color: #9ac7e7;
        }

        .current-operand {
            font-size: 2.4rem;         
            font-weight: 700;
            color: #043753;
            white-space: nowrap;
            line-height: 1.3;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        body.dark-theme .current-operand {
            color: #e2f0ff;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-top: 8px;
        }

        .button {
            height: 80px;
            width: 80px;
            border-radius: 50%;
            border: none;
            font-size: 1.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            box-shadow: 0 12px 20px rgba(0, 50, 100, 0.2);
            border: 2px solid rgba(70, 160, 250, 0.3);
        }

        .button:hover {
            transform: translateY(-5px) scale(1.02);
            filter: brightness(1.05);
            box-shadow: 0 18px 28px rgba(0, 70, 140, 0.3);
        }

        .button:active {
            transform: translateY(2px) scale(0.98);
            box-shadow: 0 5px 12px rgba(0, 30, 80, 0.2);
        }

        .number-button {
            background: linear-gradient(145deg, #e5f2ff, #c2e0ff);
            color: #023b66;
            border: 2px solid #9dc9f0;
        }

        body.dark-theme .number-button {
            background: linear-gradient(145deg, #1c4460, #0e3047);
            color: #daf0ff;
            border: 2px solid #2a6790;
        }

        .operation-button {
            background: linear-gradient(145deg, #4797e0, #1b62a5);
            color: white;
            border: 2px solid #9acdfc;
            font-weight: 700;
        }

        body.dark-theme .operation-button {
            background: linear-gradient(145deg, #226aa3, #124572);
            border: 2px solid #4797cf;
        }

        .equals-button {
            background: linear-gradient(145deg, #1f6dc6, #06417a);
            color: white;
            border: 2px solid #a3cffc;
            font-weight: 800;
        }

        body.dark-theme .equals-button {
            background: linear-gradient(145deg, #2b74b0, #093d61);
            border-color: #63acf0;
        }

        .clear-button, .delete-button {
            background: linear-gradient(145deg, #6aaae6, #3173b3);
            color: white;
            border: 2px solid #b9dcff;
        }

        body.dark-theme .clear-button, 
        body.dark-theme .delete-button {
            background: linear-gradient(145deg, #215e8c, #0a3857);
            border: 2px solid #3980b5;
        }

        .decimal-button {
            background: linear-gradient(145deg, #e5f2ff, #c2e0ff);
            color: #023b66;
            border: 2px solid #9dc9f0;
        }

        body.dark-theme .decimal-button {
            background: linear-gradient(145deg, #1c4460, #0e3047);
            color: #daf0ff;
            border: 2px solid #2a6790;
        }

        .span-two {
            width: 178px;             
            border-radius: 60px;
            grid-column: span 2;
        }

        .calculator-footer {
            margin-top: 28px;
            text-align: center;
            color: #21618c;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        body.dark-theme .calculator-footer {
            color: #8bbde2;
        }

        .decorative-circle {
            position: absolute;
            border-radius: 50%;
            z-index: 0;
            opacity: 0.15;
            pointer-events: none;
        }

        .circle-1 {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle at 30% 30%, #70b8ff, #2f6eb0);
            top: -120px;
            left: -100px;
        }

        .circle-2 {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle at 70% 70%, #a1d0ff, #3777bd);
            bottom: -90px;
            right: -80px;
        }

        body.dark-theme .circle-1 {
            background: radial-gradient(circle at 30% 30%, #2f6396, #103759);
        }

        body.dark-theme .circle-2 {
            background: radial-gradient(circle at 70% 70%, #236197, #082d4f);
        }

        @media (max-width: 450px) {
            .calculator-container { max-width: 360px; padding: 20px 16px; }
            .button { height: 70px; width: 70px; font-size: 1.6rem; }
            .span-two { width: 158px; }
            .current-operand { font-size: 2.2rem; }   
            .display { min-height: 150px; }
        }

        @media (max-width: 360px) {
            .calculator-container { max-width: 320px; }
            .button { height: 65px; width: 65px; font-size: 1.5rem; }
            .span-two { width: 148px; }
            .current-operand { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <div class="calculator-container">
        <div class="decorative-circle circle-1"></div>
        <div class="decorative-circle circle-2"></div>
        
        <button class="theme-toggle" id="theme-toggle">
            <i class="fas fa-moon"></i>
        </button>
        
        <div class="display">
            <div class="previous-operand" id="previous-operand"></div>
            <div class="current-operand" id="current-operand">0</div>
        </div>
        
        <div class="buttons-grid">
            <button class="button clear-button span-two" id="clear-all">AC</button>
            <button class="button delete-button" id="delete">DEL</button>
            <button class="button operation-button" data-operation="÷">÷</button>
            
            <button class="button number-button" data-number="7">7</button>
            <button class="button number-button" data-number="8">8</button>
            <button class="button number-button" data-number="9">9</button>
            <button class="button operation-button" data-operation="×">×</button>
            
            <button class="button number-button" data-number="4">4</button>
            <button class="button number-button" data-number="5">5</button>
            <button class="button number-button" data-number="6">6</button>
            <button class="button operation-button" data-operation="-">-</button>
            
            <button class="button number-button" data-number="1">1</button>
            <button class="button number-button" data-number="2">2</button>
            <button class="button number-button" data-number="3">3</button>
            <button class="button operation-button" data-operation="+">+</button>
            
            <button class="button number-button span-two" data-number="0">0</button>
            <button class="button decimal-button" data-number=".">.</button>
            <button class="button equals-button" id="equals">=</button>
        </div>
        
       
    </div>

    <script>
        (function() {
            // ----- state -----
            let currentOperand = '0';
            let previousOperand = '';
            let operation = null;
            let resetCurrent = false;

            const previousElement = document.getElementById('previous-operand');
            const currentElement = document.getElementById('current-operand');
            
            // ----- helper: format -----
            const formatNumber = (num) => {
                if (Number.isInteger(num)) return num.toString();
                return parseFloat(num.toFixed(12)).toString();
            };

            // ----- update display  -----
            const updateDisplay = () => {
                currentElement.textContent = currentOperand;
                if (operation && previousOperand !== '') {
                    previousElement.textContent = `${previousOperand} ${operation}`;
                } else {
                    previousElement.textContent = previousOperand;
                }
            };

            // ----- append number / decimal -----
            const appendNumber = (num) => {
                if (currentOperand === '0' || resetCurrent) {
                    currentOperand = num;
                    resetCurrent = false;
                } else {
                    if (num === '.' && currentOperand.includes('.')) return;
                    currentOperand += num;
                }
            };

            // ----- choose operation -----
            const chooseOperation = (op) => {
                if (currentOperand === '') return;
                if (previousOperand !== '' && operation !== null && !resetCurrent) {
                    compute();           
                }
                operation = op;
                previousOperand = currentOperand;
                resetCurrent = true;      
            };

            // ----- compute -----
            const compute = () => {
                const prev = parseFloat(previousOperand);
                const curr = parseFloat(currentOperand);
                if (isNaN(prev) || isNaN(curr)) return;

                let result;
                switch (operation) {
                    case '+': result = prev + curr; break;
                    case '-': result = prev - curr; break;
                    case '×': result = prev * curr; break;
                    case '÷': 
                        if (curr === 0) {
                            alert('cannot divide by zero');
                            clearAll();
                            updateDisplay();
                            return;
                        }
                        result = prev / curr;
                        break;
                    default: return;
                }
                currentOperand = formatNumber(result);
                operation = null;
                previousOperand = '';
                resetCurrent = true;
            };

            // ----- clear all -----
            const clearAll = () => {
                currentOperand = '0';
                previousOperand = '';
                operation = null;
                resetCurrent = false;
            };

            // ----- delete last character -----
            const deleteLast = () => {
                if (currentOperand.length === 1 || (currentOperand === '0')) {
                    currentOperand = '0';
                } else {
                    currentOperand = currentOperand.slice(0, -1);
                }
                // if nothing left, set to 0
                if (currentOperand === '' || currentOperand === '-') currentOperand = '0';
            };

            // ----- theme toggle -----
            const toggleTheme = () => {
                document.body.classList.toggle('dark-theme');
                const icon = document.querySelector('#theme-toggle i');
                if (document.body.classList.contains('dark-theme')) {
                    icon.classList.remove('fa-moon');
                    icon.classList.add('fa-sun');
                } else {
                    icon.classList.remove('fa-sun');
                    icon.classList.add('fa-moon');
                }
            };

            // ----- keyboard support -----
            const handleKeyboard = (e) => {
                const key = e.key;
                if ((key >= '0' && key <= '9') || key === '.') {
                    appendNumber(key);
                    updateDisplay();
                } else if (key === '+' || key === '-' || key === '*' || key === '/') {
                    let op = key;
                    if (key === '*') op = '×';
                    if (key === '/') op = '÷';
                    chooseOperation(op);
                    updateDisplay();
                } else if (key === 'Enter' || key === '=') {
                    e.preventDefault();
                    if (operation && previousOperand && currentOperand) compute();
                    updateDisplay();
                } else if (key === 'Escape' || key === 'Delete') {
                    clearAll();
                    updateDisplay();
                } else if (key === 'Backspace') {
                    deleteLast();
                    updateDisplay();
                }
            };

            // ----- attach event listeners-----
            document.querySelectorAll('[data-number]').forEach(btn => {
                btn.addEventListener('click', () => {
                    appendNumber(btn.getAttribute('data-number'));
                    updateDisplay();
                });
            });

            document.querySelectorAll('[data-operation]').forEach(btn => {
                btn.addEventListener('click', () => {
                    chooseOperation(btn.getAttribute('data-operation'));
                    updateDisplay();
                });
            });

            document.getElementById('equals').addEventListener('click', () => {
                compute();
                updateDisplay();
            });

            document.getElementById('clear-all').addEventListener('click', () => {
                clearAll();
                updateDisplay();
            });

            document.getElementById('delete').addEventListener('click', () => {
                deleteLast();
                updateDisplay();
            });

            document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

            document.querySelectorAll('.button').forEach(btn => {
                btn.addEventListener('mousedown', () => btn.style.transform = 'scale(0.96)');
                btn.addEventListener('mouseup', () => btn.style.transform = '');
                btn.addEventListener('mouseleave', () => btn.style.transform = '');
            });

            // keyboard
            document.addEventListener('keydown', handleKeyboard);

            // initial display
            updateDisplay();

            if (document.body.classList.contains('dark-theme')) {
                document.querySelector('#theme-toggle i').classList.remove('fa-moon');
                document.querySelector('#theme-toggle i').classList.add('fa-sun');
            }
        })();
    </script>
</body>
</html>
